[project]
  copyright = "&copy 2026, Joaquín Zúñiga"

  extra_css = ["stylesheets/theme.css"]

  extra_javascript = ["scripts/elk.mjs"]

  repo_name = "Al-Infinito-y-Masaya/api"
  repo_url  = "https://github.com/Al-Infinito-y-Masaya/api"

  site_author      = "Joaquín Zúñiga <jp.zuniga.dev@gmail.com>"
  site_description = "API y motor de análisis de Mangroove."
  site_name        = "mangroove-api"

  nav = [
    { "Inicio" = "index.md" },
    {
      "Requerimientos" = [
        "requerimientos/index.md",
        "requerimientos/reglas-negocio.md",
        {
          "Funcionales" = [
            "requerimientos/funcionales/motor.md",
            "requerimientos/funcionales/operacion.md",
            "requerimientos/funcionales/consulta.md",
          ],
        },
        "requerimientos/no-funcionales.md",
      ],
    },
    {
      "Actores del sistema" = [
        "actores/index.md",
        "actores/consulta.md",
        "actores/operacion.md",
      ],
    },
    {
      "Casos de uso" = [
        "casos-uso/consulta.md",
        "casos-uso/operacion.md",
      ],
    },
    {
      "Modelo de dominio" = [
        "dominio/alcance.md",
        "dominio/decisiones.md",
        "dominio/convenciones.md",
        "dominio/procesos.md",
        "dominio/contrato.md",
        {
          "Módulos" = [
            "dominio/modulos/regiones.md",
            "dominio/modulos/adquisiciones.md",
            "dominio/modulos/insumos.md",
            "dominio/modulos/analisis.md",
            "dominio/modulos/publicacion.md",
          ],
        },
      ],
    },
  ]

  [[project.extra.social]]
    icon = "fontawesome/brands/github"
    link = "https://github.com/Al-Infinito-y-Masaya/api"

  [project.markdown_extensions]
    abbr       = {}
    admonition = {}
    attr_list  = {}
    def_list   = {}
    md_in_html = {}
    tables     = {}

    toc = {
      permalink = true,
      toc_depth = 3,
    }

    [project.markdown_extensions.pymdownx]
      caret     = {}
      details   = {}
      emoji     = {}
      highlight = {}
      keys      = {}
      mark      = {}
      tilde     = {}

      blocks.caption = {}

      tasklist.custom_checkbox = true

      snippets.auto_append = [
        "docs/snippets/abbrs.md",
        "docs/snippets/links.md",
      ]

      superfences.custom_fences = [
        {
          name   = "mermaid",
          class  = "mermaid",
          format = "pymdownx.superfences.fence_code_format",
        },
      ]

      [project.markdown_extensions.pymdownx.tabbed]
        alternate_style = true

        slugify = {
          kwds.case = "lower",
          object    = "pymdownx.slugs.slugify",
        }

    [project.markdown_extensions.zensical.extensions]
      preview.configurations = [{ targets = { include = ["**/*.md"] } }]

  [project.plugins.mkdocstrings.handlers.python.options]
    docstring_style             = "google"
    inherited_members           = true
    line_length                 = 88
    heading_level               = 2
    modernize_annotations       = true
    separate_signature          = true
    show_root_heading           = true
    show_root_full_path         = true
    show_root_members_full_path = true
    show_signature_annotations  = true
    show_source                 = true
    show_symbol_type_heading    = true
    show_symbol_type_toc        = true
    signature_crossrefs         = true

  [project.theme]
    features = [
      "content.code.copy",
      "content.tooltips",
      "navigation.footer",
      "navigation.indexes",
      "navigation.instant",
      "navigation.instant.prefetch",
      "navigation.instant.progress",
      "navigation.path",
      "navigation.pruning",
      "navigation.sections",
      "navigation.tabs",
      "navigation.tabs.sticky",
      "navigation.top",
    ]

    favicon  = "logo.svg"
    language = "es"
    logo     = "logo.svg"
    variant  = "modern"

    [[project.theme.palette]]
      media       = "(prefers-color-scheme: light)"
      scheme      = "default"
      toggle.icon = "lucide/sun"
      toggle.name = "Ir a modo oscuro"

    [[project.theme.palette]]
      media       = "(prefers-color-scheme: dark)"
      scheme      = "slate"
      toggle.icon = "lucide/moon"
      toggle.name = "Ir a modo claro"

  [project.validation]
    invalid_link_anchors  = true
    invalid_links         = true
    shadowed_definitions  = true
    shadowed_footnotes    = true
    unresolved_footnotes  = true
    unresolved_references = false
    unused_definitions    = false
    unused_footnotes      = true
