name: api

x-api-build: &api-build
  context: .
  dockerfile: dockerfile

x-api-env: &api-env
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost,healthcheck.railway.app}
  API_EMAIL_ENDPOINTS: ${API_EMAIL_ENDPOINTS:-True}
  API_MEDIA_ENDPOINTS: ${API_MEDIA_ENDPOINTS:-True}
  API_PUBLIC_REGISTRATION: ${API_PUBLIC_REGISTRATION:-True}
  API_TWO_FACTOR: ${API_TWO_FACTOR:-True}
  BUNNY_PRIVATE_PULL_ZONE_HOST: ${BUNNY_PRIVATE_PULL_ZONE_HOST:-private.cdn.example.com}
  BUNNY_PULL_ZONE_HOST: ${BUNNY_PULL_ZONE_HOST:-cdn.example.com}
  BUNNY_STORAGE_API_KEY: ${BUNNY_STORAGE_API_KEY:?}
  BUNNY_STORAGE_ZONE: ${BUNNY_STORAGE_ZONE:-api-media}
  BUNNY_TOKEN_AUTH_KEY: ${BUNNY_TOKEN_AUTH_KEY:?}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  DATABASE_URL: postgresql://api:api@postgres:5432/api
  DEPLOY: ${DEPLOY:-False}
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
  DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
  EARTHDATA_TOKEN: ${EARTHDATA_TOKEN:-}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
  MANGROOVE_ACCESO: ${MANGROOVE_ACCESO:-auto}
  MANGROOVE_CODIGO: ${MANGROOVE_CODIGO:-local}
  MANGROOVE_DATOS: /data/mangroove
  MANGROOVE_MAREA: ${MANGROOVE_MAREA:-}
  MANGROOVE_MODELO_MAREA: ${MANGROOVE_MODELO_MAREA:-GOT4.10_nc}
  MEDIA_ALLOWED_TYPES: ${MEDIA_ALLOWED_TYPES:-application/pdf:pdf,image/jpeg:jpg,image/png:png,image/webp:webp}
  REDIS_SECRET_KEY: ${REDIS_SECRET_KEY:-api}
  REDIS_URL: redis://redis:6379
  SECRET_KEY: ${SECRET_KEY:?}
  SKIP_SEEDERS: ${SKIP_SEEDERS:-False}

x-api-healthcheck: &api-healthcheck
  interval: 5s
  retries: 10
  start_period: 5s
  test:
    - CMD
    - python
    - -c
    - import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health/')
  timeout: 5s

services:
  postgres:
    environment:
      POSTGRES_DB: api
      POSTGRES_PASSWORD: api
      POSTGRES_USER: api
    healthcheck:
      interval: 5s
      retries: 10
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U api -d api"]
      timeout: 5s
    image: postgres:18
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    command: ["redis-server", "--requirepass", "${REDIS_SECRET_KEY:-api}", "--save", ""]
    healthcheck:
      interval: 5s
      retries: 10
      test: ["CMD", "redis-cli", "-a", "${REDIS_SECRET_KEY:-api}", "ping"]
      timeout: 5s
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  migrate:
    build:
      <<: *api-build
      target: runtime-prod
    command: ["python", "src/manage.py", "migrate", "--no-input"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *api-env
      DEBUG: "False"
    image: api:prod
    profiles: ["dev", "prod"]
    restart: "no"

  api-dev:
    build:
      <<: *api-build
      target: runtime-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      DEBUG: ${DEBUG:-True}
    healthcheck: *api-healthcheck
    image: api:dev
    ports:
      - "127.0.0.1:8080:8080"
    profiles: ["dev"]
    volumes:
      - ./src:/app/src

  api-prod:
    build:
      <<: *api-build
      target: runtime-prod
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      DEBUG: "False"
    healthcheck: *api-healthcheck
    image: api:prod
    ports:
      - "127.0.0.1:8080:8080"
    profiles: ["prod"]
    restart: unless-stopped
    volumes:
      - datos:/data/mangroove
      - ${MANGROOVE_MAREA_HOST:-./.marea}:/data/marea:ro
      - ${MANGROOVE_ENTRADA_HOST:-./deploy}:/data/entrada:ro

volumes:
  datos:
  pgdata:
